<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nguồn truyện NovelBook</title>
    <meta name="description" content="Nguồn truyện NovelBook" />

    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      (function() {
        const saved = localStorage.getItem("theme");
        if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <style>
      :root {
        --md-sys-color-primary: #415aa8;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-primary-container: #dce1ff;
        --md-sys-color-on-primary-container: #001552;
        --md-sys-color-secondary-container: #dee1f9;
        --md-sys-color-on-secondary-container: #161b2c;
        --md-sys-color-success-container: #a4f5b5;
        --md-sys-color-on-success-container: #00210b;
        --md-sys-color-background: #fbf8fd;
        --md-sys-color-surface: #fbf8fd;
        --md-sys-color-on-surface: #1b1b1f;
        --md-sys-color-on-surface-variant: #46464f;
        --md-sys-color-surface-container-lowest: #ffffff;
        --md-sys-color-surface-container-low: #f5f2f8;
        --md-sys-color-surface-container: #efedf2;
        --md-sys-color-surface-container-high: #e9e7ec;
        --md-sys-color-surface-container-highest: #e3e1e6;
        --md-sys-color-outline: #777680;
        --md-sys-color-outline-variant: #c7c5d0;
        --md-sys-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.08), 0px 1px 2px 0px rgba(0, 0, 0, 0.15);
      }

      html.dark {
        --md-sys-color-primary: #adc6ff;
        --md-sys-color-on-primary: #002e69;
        --md-sys-color-primary-container: #004494;
        --md-sys-color-on-primary-container: #d8e2ff;
        --md-sys-color-secondary-container: #2b3042;
        --md-sys-color-on-secondary-container: #dee1f9;
        --md-sys-color-background: #111318;
        --md-sys-color-surface: #111318;
        --md-sys-color-on-surface: #e2e2e9;
        --md-sys-color-on-surface-variant: #c4c6d0;
        --md-sys-color-surface-container-lowest: #191c20;
        --md-sys-color-surface-container-low: #1d2024;
        --md-sys-color-surface-container: #212429;
        --md-sys-color-surface-container-high: #2b2e33;
        --md-sys-color-surface-container-highest: #36393e;
        --md-sys-color-outline: #8e9099;
        --md-sys-color-outline-variant: #3c3f46;
        --md-sys-elevation-2: 0px 2px 8px 2px rgba(0, 0, 0, 0.4);
      }

      html {
        scroll-behavior: smooth;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: var(--md-sys-color-background);
        color: var(--md-sys-color-on-surface);
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }

      button, input {
        font-family: inherit;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      .sticky-header {
        position: sticky;
        top: 0;
        z-index: 100;
        width: 100%;
        background-color: rgba(251, 248, 253, 0.78);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 12px 16px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        transition: background-color 0.2s, border-color 0.2s;
      }

      html.dark .sticky-header {
        background-color: rgba(17, 19, 24, 0.78);
        border-bottom-color: rgba(255, 255, 255, 0.06);
      }

      .app-layout {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 14px 16px 24px;
      }

      /* MD3 Search Bar */
      .search-box {
        max-width: 480px;
        width: 80%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        height: 46px;
        background-color: var(--md-sys-color-surface-container-high);
        border-radius: 23px;
        padding: 0 14px;
        border: 1px solid transparent;
        transition: background-color 0.2s, box-shadow 0.2s, border-color 0.2s;
      }

      .search-box:hover {
        background-color: var(--md-sys-color-surface-container-highest);
      }

      .search-box:focus-within {
        background-color: var(--md-sys-color-surface-container-lowest);
        border-color: var(--md-sys-color-primary);
        box-shadow: var(--md-sys-elevation-2);
      }

      .search-icon {
        color: var(--md-sys-color-on-surface-variant);
        display: flex;
        margin-right: 10px;
      }

      .search-input {
        flex: 1;
        height: 100%;
        border: none;
        outline: none;
        background: transparent;
        font-size: 15px;
        color: var(--md-sys-color-on-surface);
      }

      .search-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .icon-btn {
        display: none;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: var(--md-sys-color-on-surface-variant);
        cursor: pointer;
      }

      .icon-btn:hover {
        background-color: rgba(0, 0, 0, 0.06);
      }

      /* Status bar */
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding: 0 2px;
        font-size: 13px;
        color: var(--md-sys-color-on-surface-variant);
      }

      .status-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .theme-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--md-sys-color-outline-variant);
        background-color: var(--md-sys-color-surface-container-high);
        color: var(--md-sys-color-on-surface);
        cursor: pointer;
        transition: background-color 0.2s, border-color 0.2s, transform 0.15s, color 0.2s;
      }

      .theme-btn:hover {
        background-color: var(--md-sys-color-surface-container-highest);
        transform: scale(1.08);
      }

      html.dark .sun-icon { display: block; }
      html.dark .moon-icon { display: none; }
      html:not(.dark) .sun-icon { display: none; }
      html:not(.dark) .moon-icon { display: block; }

      .reset-btn {
        display: none;
        background: none;
        border: none;
        color: var(--md-sys-color-primary);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 12px;
      }

      .reset-btn:hover {
        background-color: rgba(65, 90, 168, 0.08);
      }

      /* Cards Grid */
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      @media (min-width: 640px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 1024px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (min-width: 1280px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .card {
        background-color: var(--md-sys-color-surface-container-lowest);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 16px;
        padding: 8px 12px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        border-color: var(--md-sys-color-primary);
        box-shadow: var(--md-sys-elevation-2);
        background-color: var(--md-sys-color-surface-container-low);
      }

      .card:focus-visible {
        outline: 2px solid var(--md-sys-color-primary);
        outline-offset: 2px;
      }

      .card-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }

      /* Logo bên trái */
      .card-logo-box {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background-color: var(--md-sys-color-surface-container-high);
        border: 1px solid rgba(0, 0, 0, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        overflow: hidden;
        position: relative;
      }

      .web-logo {
        width: 24px;
        height: 24px;
        object-fit: contain;
        display: block;
      }

      .avatar-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 15px;
        color: var(--md-sys-color-primary);
        background-color: var(--md-sys-color-surface-container-high);
      }

      .card-info {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .domain {
        font-size: 14px;
        font-weight: 600;
        color: var(--md-sys-color-on-surface);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.15s;
      }

      .card:hover .domain {
        color: var(--md-sys-color-primary);
      }

      .tag {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 500;
        padding: 1px 6px;
        border-radius: 4px;
        width: fit-content;
      }

      .t-trung { background-color: #ffe6cc; color: #873600; }
      .t-nhat { background-color: #ffd8eb; color: #83004f; }
      .t-viet { background-color: #c4f3d0; color: #00532b; }
      .t-anh { background-color: #cbe6ff; color: #004d80; }

      html.dark .t-trung { background-color: #4a2800; color: #ffcc99; }
      html.dark .t-nhat { background-color: #4d0b33; color: #ffb5db; }
      html.dark .t-viet { background-color: #00391d; color: #85f3b2; }
      html.dark .t-anh { background-color: #00325b; color: #a8d5ff; }
      html.dark .icon-btn:hover { background-color: rgba(255, 255, 255, 0.08); }
      html.dark .reset-btn:hover { background-color: rgba(173, 198, 255, 0.12); }
      html.dark .card { border-color: rgba(255, 255, 255, 0.08); }
      html.dark .card-logo-box { border-color: rgba(255, 255, 255, 0.08); }
      html.dark .card:hover .card-open-btn {
        background-color: #004494;
        color: #d8e2ff;
      }

      /* Nút mở chuyển link bên phải theo hình vẽ */
      .card-open-btn {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background-color: var(--md-sys-color-primary-container);
        color: var(--md-sys-color-on-primary-container);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
      }

      .card:hover .card-open-btn {
        background-color: #cbd5ff;
        color: var(--md-sys-color-primary);
        transform: scale(1.06);
        box-shadow: var(--md-sys-elevation-1);
      }

      /* Empty State */
      .empty {
        text-align: center;
        padding: 48px 16px;
        background-color: var(--md-sys-color-surface-container-low);
        border-radius: 14px;
        border: 1px dashed var(--md-sys-color-outline-variant);
        margin: 16px 0;
        display: none;
      }

      .empty h3 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      .btn-empty {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 16px;
        border-radius: 999px;
        border: none;
        background-color: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      mark.hl {
        background-color: #ffe085;
        padding: 0 1px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <!-- Sticky Search Header with Blur -->
    <header class="sticky-header">
      <div class="search-box">
        <div class="search-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </div>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Tìm kiếm..."
          autocomplete="off"
          spellcheck="false"
        />
        <div class="search-actions">
          <button type="button" id="clearSearchBtn" class="icon-btn" title="Xóa">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="app-layout">
      <!-- Status -->
      <div class="status">
        <span id="resultsCount"><strong>73</strong> nguồn</span>
        <div class="status-actions">
          <button type="button" id="themeToggleBtn" class="theme-btn" title="Đổi giao diện Sáng / Tối" aria-label="Đổi giao diện">
            <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
            </svg>
            <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
          </button>
          <button type="button" id="resetFiltersBtn" class="reset-btn">Đặt lại</button>
        </div>
      </div>

      <!-- Grid -->
      <main>
        <div class="grid" id="sourcesGrid"></div>

        <div class="empty" id="emptyState">
          <h3>Không tìm thấy nguồn</h3>
          <button type="button" class="btn-empty" id="emptyResetBtn">Đặt lại bộ lọc</button>
        </div>
      </main>
    </div>

    <script>
      const RAW_SOURCES = [
        "aatruyen.net", "aztruyen.top", "dammy.cc", "dammy.me", "dichngay.com", "docfull.vip",
        "docln.sbs", "dualeotruyenfull.net", "eviehouse.wordpress.com", "gaumeoteam.com",
        "happypineappleee.wordpress.com", "hatduahau.com", "hongngucoc.wordpress.com", "inkitt.com",
        "khotruyenchu.fun", "kyhuyen.com", "linhdi.vn", "ln.hako.vn", "lovetruyen.pro",
        "metruyenhot.me", "metruyensangtac.com", "mongtruyen.com",
        "navyteams.com", "nhatruyen.site", "noveltoon.mobi", "noveltoon.vn", "ntruyen.lat",
        "phamvuc.com", "plnovel.com", "sangtacviet.xyz", "tacgiaviet.com", "teamtruyen.com",
        "teenfic.net", "thungtruyen.com", "tienvuc.top", "tieuthuyet.vn", "tieuthuyetmang.com",
        "truyen-h.com", "truyenchu.net", "truyencn.com", "truyendich.store", "truyendichai.top",
        "truyenflow.com", "truyenfull.live", "truyenh.top", "truyenhdc.com", "truyenhoan.com",
        "truyennet.org", "truyentronbo.com", "valvrareteam.net", "vietnamthuquan.eu",
        "vivutruyen.net", "wattpad.com", "webnovel.com", "webnovel.vn", "webtruyendich.com",
        "wikicv.org", "wikidichvn.com", "wuxiaworld.com", "www.chivi.app", "www.lacatruyen.vip",
        "www.loppytoon.com", "www.metruyenchuvn.com", "www.msvtruyen.com", "www.sitruyencv.com",
        "www.sstruyen.net", "www.truyencom.com", "www.truyenmoikk.com", "www.truyenyy.co",
        "www.tvtruyen.com", "www.wattpad.com", "xtruyen.net", "zingtruyen.store"
      ];

      const TRUYEN_NHAT_SET = new Set([
        "docln.sbs", "ln.hako.vn", "plnovel.com", "valvrareteam.net"
      ]);

      const TRUYEN_ANH_SET = new Set([
        "wattpad.com", "www.wattpad.com", "webnovel.com", "webnovel.vn",
        "wuxiaworld.com", "inkitt.com", "noveltoon.mobi", "noveltoon.vn",
        "www.loppytoon.com"
      ]);

      const TRUYEN_VIET_SET = new Set([
        "metruyensangtac.com", "sangtacviet.xyz", "tacgiaviet.com",
        "teenfic.net", "vietnamthuquan.eu"
      ]);

      const DAM_MY_SET = new Set([
        "dammy.cc", "dammy.me", "dualeotruyenfull.net", "eviehouse.wordpress.com",
        "gaumeoteam.com", "happypineappleee.wordpress.com", "hatduahau.com",
        "hongngucoc.wordpress.com", "navyteams.com"
      ]);

      function isDamMy(domain) {
        const d = domain.toLowerCase();
        return DAM_MY_SET.has(d) || d.includes("dammy");
      }

      function getCategory(domain) {
        const d = domain.toLowerCase();
        if (TRUYEN_NHAT_SET.has(d)) return "Truyện Nhật";
        if (TRUYEN_ANH_SET.has(d)) return "Truyện Anh";
        if (TRUYEN_VIET_SET.has(d)) return "Truyện Việt";
        return "Truyện Trung";
      }

      function getTagClass(cat) {
        switch (cat) {
          case "Truyện Nhật": return "t-nhat";
          case "Truyện Anh": return "t-anh";
          case "Truyện Việt": return "t-viet";
          default: return "t-trung";
        }
      }

      function getLetter(d) {
        const c = d.replace(/^www\./i, "").replace(/^m\./i, "");
        return (c.charAt(0) || "T").toUpperCase();
      }

      const DATA = RAW_SOURCES.map(d => ({
        domain: d,
        dLower: d.toLowerCase(),
        dClean: d.toLowerCase().replace(/^www\./i, ""),
        cat: getCategory(d),
        isDamMy: isDamMy(d),
        letter: getLetter(d)
      })).sort((a, b) => {
        if (a.isDamMy !== b.isDamMy) {
          return a.isDamMy ? 1 : -1;
        }
        return a.dClean.localeCompare(b.dClean);
      });

      let query = "";

      const searchInput = document.getElementById("searchInput");
      const clearSearchBtn = document.getElementById("clearSearchBtn");
      const resultsCountEl = document.getElementById("resultsCount");
      const resetFiltersBtn = document.getElementById("resetFiltersBtn");
      const grid = document.getElementById("sourcesGrid");
      const empty = document.getElementById("emptyState");

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, m => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[m]));
      }

      function highlight(text, q) {
        if (!q) return escapeHtml(text);
        const idx = text.toLowerCase().indexOf(q.toLowerCase());
        if (idx === -1) return escapeHtml(text);
        return `${escapeHtml(text.slice(0, idx))}<mark class="hl">${escapeHtml(text.slice(idx, idx + q.length))}</mark>${escapeHtml(text.slice(idx + q.length))}`;
      }

      function handleLogoError(img, domain, letter) {
        if (!img.dataset.ddg) {
          img.dataset.ddg = "1";
          img.src = `https://icons.duckduckgo.com/ip3/${domain}.ico`;
          return;
        }
        if (!img.dataset.direct) {
          img.dataset.direct = "1";
          img.src = `https://${domain}/favicon.ico`;
          return;
        }
        img.style.display = "none";
        const parent = img.parentElement;
        if (parent && !parent.querySelector(".avatar-fallback")) {
          const fb = document.createElement("div");
          fb.className = "avatar-fallback";
          fb.textContent = letter;
          parent.appendChild(fb);
        }
      }

      function update() {
        const q = query.trim().toLowerCase();
        const qNoWww = q.replace(/^www\./i, "");

        const filtered = DATA.filter(item => {
          if (q) {
            const m1 = item.dLower.includes(q);
            const m2 = item.dClean.includes(qNoWww);
            const m3 = item.cat.toLowerCase().includes(q);
            if (!m1 && !m2 && !m3) return false;
          }
          return true;
        });

        resultsCountEl.innerHTML = `<strong>${filtered.length}</strong> / ${DATA.length} nguồn`;

        const hasFilter = q.length > 0;
        resetFiltersBtn.style.display = hasFilter ? "inline-block" : "none";
        clearSearchBtn.style.display = q.length > 0 ? "inline-flex" : "none";

        if (filtered.length === 0) {
          grid.innerHTML = "";
          grid.style.display = "none";
          empty.style.display = "block";
          return;
        }

        empty.style.display = "none";
        grid.style.display = "grid";

        let html = "";
        filtered.forEach(item => {
          const domHtml = q ? highlight(item.domain, qNoWww || q) : escapeHtml(item.domain);
          html += `
            <a
              href="https://${escapeHtml(item.domain)}"
              target="_self"
              rel="noopener noreferrer"
              class="card"
              title="Mở https://${escapeHtml(item.domain)}"
            >
              <div class="card-left">
                <div class="card-logo-box">
                  <img
                    class="web-logo"
                    src="https://t2.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://${escapeHtml(item.dClean)}&size=64"
                    alt=""
                    loading="eager"
                    decoding="async"
                    referrerpolicy="no-referrer"
                    onerror="handleLogoError(this, '${escapeHtml(item.dClean)}', '${escapeHtml(item.letter)}')"
                  />
                </div>
                <div class="card-info">
                  <div class="domain">${domHtml}</div>
                  <span class="tag ${getTagClass(item.cat)}">${item.cat}</span>
                </div>
              </div>
              <div class="card-open-btn" aria-label="Mở trang">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
                </svg>
              </div>
            </a>
          `;
        });

        grid.innerHTML = html;
      }

      searchInput.addEventListener("input", e => {
        query = e.target.value;
        update();
      });

      clearSearchBtn.addEventListener("click", () => {
        query = "";
        searchInput.value = "";
        searchInput.focus();
        update();
      });

      function resetAll() {
        query = "";
        searchInput.value = "";
        update();
        searchInput.focus();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      resetFiltersBtn.addEventListener("click", resetAll);
      document.getElementById("emptyResetBtn").addEventListener("click", resetAll);

      document.addEventListener("keydown", e => {
        const inInput = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
        if (e.key === "/" && !inInput) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        } else if (e.key === "Escape" && inInput) {
          if (searchInput.value) {
            searchInput.value = "";
            query = "";
            update();
          } else {
            searchInput.blur();
          }
        }
      });

      const themeToggleBtn = document.getElementById("themeToggleBtn");
      function applyTheme(theme) {
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
        localStorage.setItem("theme", theme);
      }

      themeToggleBtn.addEventListener("click", () => {
        const isDark = document.documentElement.classList.contains("dark");
        applyTheme(isDark ? "light" : "dark");
      });

      update();
    </script>
  </body>
</html>
